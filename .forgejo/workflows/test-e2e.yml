name: Test:e2e(all)

on:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - 'tsdown.config.*'
      - 'jest.config.js'
      - 'jest.public.js'
      - '.forgejo/workflows/test-e2e.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - 'tsdown.config.*'
      - 'jest.config.js'
      - 'jest.public.js'
      - '.forgejo/workflows/test-e2e.yml'
  workflow_dispatch:
env:
  BUCKET_ENV_BACKBLAZE: ${{ secrets.BUCKET_ENV_BACKBLAZE }}
  BUCKET_ENV_MINIO: ${{ secrets.BUCKET_ENV_MINIO }}
  BUCKET_ENV_CLOUDFLARE: ${{ secrets.BUCKET_ENV_CLOUDFLARE }}
  BUCKET_ENV_DIGITALOCEAN: ${{ secrets.BUCKET_ENV_DIGITALOCEAN }}
  BUCKET_ENV_GARAGE: ${{ secrets.BUCKET_ENV_GARAGE }}
  BUCKET_ENV_CEPH: ${{ secrets.BUCKET_ENV_CEPH }}
  BUCKET_ENV_SCALEWAY: ${{ secrets.BUCKET_ENV_SCALEWAY }}
  BUCKET_ENV_HETZNER: ${{ secrets.BUCKET_ENV_HETZNER }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Check Docker version
        run: docker --version && docker compose version

      - uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bun
        env:
          BUN_VERSION: 1.3.13
          BUN_SHA256: 79c0771fa8b92c33aae41e15a0e0d307ea99d0e2f00317c71c6c53237a78e25a
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip" -o /tmp/bun.zip
          echo "${BUN_SHA256}  /tmp/bun.zip" | sha256sum -c -
          unzip -q /tmp/bun.zip -d /tmp/bun-extract
          install -D -m 0755 /tmp/bun-extract/bun-linux-x64/bun "$HOME/.bun/bin/bun"
          rm -rf /tmp/bun.zip /tmp/bun-extract
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: npm run build

      - name: Run e2e tests (Node)
        uses: https://github.com/nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2 pin
        with:
          max_attempts: 3
          retry_on: any
          timeout_minutes: 10
          retry_wait_seconds: 30
          command: npm run test:e2e

      - name: Run e2e tests (Bun)
        uses: https://github.com/nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2 pin
        with:
          max_attempts: 3
          retry_on: any
          timeout_minutes: 10
          retry_wait_seconds: 30
          command: npm run test:e2e:bun
